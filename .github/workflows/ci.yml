name: CMake CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            zookeeper: "OFF"
          - name: zookeeper
            zookeeper: "ON"
    env:
      BUILD_DIR: cmake-build-ci-${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libzookeeper-mt-dev \
            libprotobuf-dev \
            nlohmann-json3-dev \
            protobuf-compiler

      - name: Configure CMake
        run: |
          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DASTERRPC_WITH_ZOOKEEPER="${{ matrix.zookeeper }}"

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Run tests
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure
